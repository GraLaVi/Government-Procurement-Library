# Production nginx configuration for Govt Procurement Library
# Proxies to Docker service names on govtlib_network

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # --- Restore real client IP from Cloudflare ---
    # Requests reach us via the Cloudflare proxy, so $remote_addr is a CF edge
    # IP. Trust only Cloudflare's published ranges and take the true visitor IP
    # from the CF-Connecting-IP header. This corrects the access log AND the
    # X-Real-IP / X-Forwarded-For values forwarded upstream.
    # Ranges: https://www.cloudflare.com/ips-v4 and /ips-v6 (refresh periodically).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # HTTP -> HTTPS redirect for Web
    server {
        listen 80;
        server_name www.gphusa.com;
        return 301 https://$host$request_uri;
    }

    # NOTE: Apex (gphusa.com) -> https://www.gphusa.com redirect is handled at
    # Cloudflare's edge via a Redirect Rule, not here. The origin's Let's Encrypt
    # cert only covers www.gphusa.com, so terminating apex TLS at nginx would
    # trigger Cloudflare error 526 (origin cert name mismatch) under Full (strict).
    # Keep apex traffic off the origin unless the cert is reissued to include it.

    # HTTPS Web server
    server {
        listen 443 ssl;
        http2 on;
        server_name www.gphusa.com;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/www.gphusa.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.gphusa.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Proxy to Next.js container
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket support for Next.js hot reload (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Next.js static assets
        location /_next/static {
            proxy_pass http://web:3000;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        # Next.js images
        location /_next/image {
            proxy_pass http://web:3000;
            proxy_cache_valid 200 60m;
        }
    }
}
